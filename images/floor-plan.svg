<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="1280" height="800"><style>.plan-label{font-family:"Work Sans",system-ui,sans-serif;font-weight:600;fill:#2a211c;paint-order:stroke;stroke:#fffaf0;stroke-width:4px;stroke-linejoin:round}</style>
            <title id="plan-title">Illustrated map of the shop</title>
            <desc id="plan-desc">A top-down drawing of Side Quest. A coffee counter with an espresso machine and pastry case runs along the left wall. Game shelves line the right wall. A big community table in the middle has a game in progress, cards, dice, and coffee cups, surrounded by mismatched chairs. Smaller wood tables hold a chess game, a laptop and latte, and a two-person meeting. Plants sit in the front windows.</desc>
            <defs>
              <pattern id="planks" width="96" height="22" patternUnits="userSpaceOnUse">
                <rect width="96" height="22" fill="#ead6b3"/>
                <path d="M0 21.5h96M48 0v22" stroke="#dcc296" stroke-width="1"/>
              </pattern>
              <g id="cup-top"><circle r="7" fill="#fffaf0"/><circle r="4.6" fill="#7a4a2a"/></g>
            </defs>

            <!-- floor & walls -->
            <rect x="8" y="8" width="624" height="384" rx="6" fill="url(#planks)" stroke="#3a2a20" stroke-width="10"/>
            <!-- front windows with plants -->
            <g fill="#cfe2e8" stroke="#3a2a20" stroke-width="2">
              <rect x="170" y="3" width="90" height="10"/><rect x="290" y="3" width="90" height="10"/><rect x="410" y="3" width="90" height="10"/>
            </g>
            <g>
              <rect x="186" y="16" width="14" height="10" rx="2" fill="#a8613a"/><circle cx="193" cy="22" r="10" fill="#5f7356"/><circle cx="199" cy="17" r="6" fill="#7d9470"/>
              <rect x="230" y="16" width="12" height="9" rx="2" fill="#a8613a"/><circle cx="236" cy="20" r="8" fill="#7d9470"/>
              <rect x="320" y="16" width="14" height="10" rx="2" fill="#a8613a"/><circle cx="327" cy="22" r="11" fill="#5f7356"/><circle cx="320" cy="17" r="6" fill="#7d9470"/>
              <rect x="440" y="16" width="14" height="10" rx="2" fill="#a8613a"/><circle cx="447" cy="21" r="9" fill="#7d9470"/><circle cx="453" cy="25" r="6" fill="#5f7356"/>
              <rect x="476" y="16" width="12" height="9" rx="2" fill="#a8613a"/><circle cx="482" cy="20" r="8" fill="#5f7356"/>
            </g>
            <!-- front door -->
            <rect x="285" y="384" width="70" height="14" fill="#ead6b3"/>
            <rect x="295" y="368" width="50" height="14" rx="3" fill="#8a2a2e" opacity=".85"/>

            <!-- coffee counter -->
            <rect x="18" y="40" width="74" height="240" rx="5" fill="#5a3a24"/>
            <rect x="26" y="52" width="58" height="34" rx="4" fill="#a9b0b2"/>
            <circle cx="42" cy="69" r="6" fill="#6d7476"/><circle cx="68" cy="69" r="6" fill="#6d7476"/>
            <use href="#cup-top" x="40" y="108"/><use href="#cup-top" x="62" y="108"/><use href="#cup-top" x="40" y="128"/>
            <rect x="26" y="160" width="58" height="100" rx="4" fill="#f4ead8" opacity=".92"/>
            <g fill="#c58a4a"><circle cx="42" cy="180" r="8"/><circle cx="68" cy="180" r="8"/><circle cx="42" cy="204" r="8"/></g>
            <g fill="#d9a65a"><rect x="58" y="196" width="20" height="16" rx="3"/><rect x="34" y="222" width="20" height="16" rx="3"/></g>
            <path d="M58 228c4-6 14-6 18 0-4 6-14 6-18 0z" fill="#a8613a"/>

            <!-- game shelves -->
            <rect x="556" y="40" width="66" height="300" rx="5" fill="#6b4a33"/>
            <g>
              <rect x="563" y="48" width="52" height="20" rx="2" fill="#8a2a2e"/>
              <rect x="563" y="72" width="46" height="24" rx="2" fill="#b8893e"/>
              <rect x="563" y="100" width="52" height="18" rx="2" fill="#3f5a45"/>
              <rect x="563" y="122" width="40" height="22" rx="2" fill="#2f4f6b"/>
              <rect x="563" y="148" width="52" height="20" rx="2" fill="#c9653a"/>
              <rect x="563" y="172" width="48" height="26" rx="2" fill="#6b5a8e"/>
              <rect x="563" y="202" width="52" height="18" rx="2" fill="#d9b36c"/>
              <rect x="563" y="224" width="44" height="22" rx="2" fill="#8a2a2e"/>
              <rect x="563" y="250" width="52" height="20" rx="2" fill="#2f4f6b"/>
              <rect x="563" y="274" width="50" height="24" rx="2" fill="#3f5a45"/>
              <rect x="563" y="302" width="52" height="30" rx="2" fill="#f4ead8"/>
              <path d="M570 310h38M570 317h38M570 324h38" stroke="#b8893e" stroke-width="2"/>
            </g>

            <!-- community table, mismatched chairs -->
            <g>
              <circle cx="250" cy="134" r="12" fill="#3f5a45"/>
              <rect x="285" y="122" width="24" height="22" rx="5" fill="#8a2a2e"/>
              <circle cx="350" cy="134" r="12" fill="#2f4f6b"/>
              <rect x="386" y="122" width="24" height="22" rx="7" fill="#c9653a"/>
              <rect x="238" y="250" width="24" height="22" rx="7" fill="#b8893e"/>
              <circle cx="300" cy="262" r="12" fill="#6b5a8e"/>
              <rect x="338" y="250" width="24" height="22" rx="4" fill="#3f5a45"/>
              <circle cx="398" cy="262" r="12" fill="#8a2a2e"/>
              <rect x="196" y="186" width="22" height="24" rx="6" fill="#2f4f6b"/>
              <circle cx="444" cy="198" r="12" fill="#b8893e"/>
            </g>
            <rect x="220" y="150" width="210" height="96" rx="12" fill="#a0703f" stroke="#7a5230" stroke-width="3"/>
            <path d="M228 170h194M228 196h194M228 222h194" stroke="#8d6034" stroke-width="1" opacity=".6"/>
            <!-- game in progress -->
            <g transform="translate(305 198) rotate(-6)">
              <rect x="-30" y="-30" width="60" height="60" rx="3" fill="#f4ead8"/>
              <path d="M-30-10h60M-30 10h60M-10-30v60M10-30v60" stroke="#c9b48f" stroke-width="1.5"/>
              <circle cx="-20" cy="-20" r="4" fill="#8a2a2e"/><circle cx="0" cy="0" r="4" fill="#2f4f6b"/><circle cx="20" cy="20" r="4" fill="#3f5a45"/><circle cx="20" cy="-20" r="4" fill="#d9b36c"/>
            </g>
            <g fill="#fffaf0" stroke="#d8c8a8">
              <rect x="352" y="168" width="18" height="26" rx="2" transform="rotate(-12 361 181)"/>
              <rect x="360" y="170" width="18" height="26" rx="2" transform="rotate(8 369 183)"/>
              <rect x="244" y="206" width="18" height="26" rx="2" transform="rotate(20 253 219)"/>
            </g>
            <rect x="388" y="214" width="13" height="13" rx="2.5" fill="#fffaf0"/>
            <rect x="404" y="206" width="13" height="13" rx="2.5" fill="#d9b36c" transform="rotate(18 410 212)"/>
            <use href="#cup-top" x="250" y="172"/><use href="#cup-top" x="400" y="180"/><use href="#cup-top" x="356" y="228"/>

            <!-- chess table -->
            <rect x="460" y="70" width="10" height="44" rx="4" fill="#6b5a8e"/>
            <rect x="528" y="72" width="16" height="40" rx="7" fill="#c9653a"/>
            <rect x="474" y="62" width="50" height="60" rx="5" fill="#a0703f" stroke="#7a5230" stroke-width="2"/>
            <g transform="translate(482 75)">
              <rect width="34" height="34" fill="#f4ead8"/>
              <g fill="#2a211c" opacity=".8">
                <rect x="0" y="0" width="8.5" height="8.5"/><rect x="17" y="0" width="8.5" height="8.5"/>
                <rect x="8.5" y="8.5" width="8.5" height="8.5"/><rect x="25.5" y="8.5" width="8.5" height="8.5"/>
                <rect x="0" y="17" width="8.5" height="8.5"/><rect x="17" y="17" width="8.5" height="8.5"/>
                <rect x="8.5" y="25.5" width="8.5" height="8.5"/><rect x="25.5" y="25.5" width="8.5" height="8.5"/>
              </g>
            </g>

            <!-- meeting table near window -->
            <circle cx="160" cy="62" r="11" fill="#b8893e"/>
            <rect x="148" y="112" width="24" height="20" rx="5" fill="#3f5a45"/>
            <circle cx="160" cy="96" r="24" fill="#a0703f" stroke="#7a5230" stroke-width="2"/>
            <use href="#cup-top" x="152" y="92"/><use href="#cup-top" x="169" y="101"/>

            <!-- laptop & latte table -->
            <circle cx="128" cy="300" r="11" fill="#8a2a2e"/>
            <rect x="174" y="336" width="22" height="22" rx="4" fill="#2f4f6b"/>
            <circle cx="162" cy="330" r="28" fill="#a0703f" stroke="#7a5230" stroke-width="2"/>
            <rect x="146" y="318" width="26" height="18" rx="2" fill="#6d7476"/>
            <rect x="149" y="321" width="20" height="12" rx="1" fill="#a9b0b2"/>
            <use href="#cup-top" x="178" y="336"/>

            <!-- card game table -->
            <circle cx="470" cy="296" r="11" fill="#3f5a45"/>
            <rect x="508" y="330" width="22" height="22" rx="7" fill="#d9b36c"/>
            <rect x="430" y="330" width="22" height="22" rx="4" fill="#c9653a"/>
            <circle cx="480" cy="336" r="30" fill="#a0703f" stroke="#7a5230" stroke-width="2"/>
            <g fill="#fffaf0" stroke="#d8c8a8">
              <rect x="466" y="322" width="14" height="20" rx="2" transform="rotate(-15 473 332)"/>
              <rect x="476" y="322" width="14" height="20" rx="2"/>
              <rect x="486" y="322" width="14" height="20" rx="2" transform="rotate(15 493 332)"/>
            </g>
            <use href="#cup-top" x="470" y="352"/>

            <!-- labels -->
            <g class="plan-label" font-size="13">
              <text x="55" y="300" text-anchor="middle">Coffee counter</text>
              <text x="589" y="360" text-anchor="middle">Game shelves</text>
              <text x="325" y="294" text-anchor="middle">Community table</text>
              <text x="335" y="52" text-anchor="middle">Plants in the windows</text>
              <text x="502" y="142" text-anchor="middle">Chess corner</text>
              <text x="160" y="146" text-anchor="middle">Client meeting</text>
              <text x="162" y="382" text-anchor="middle">Laptop &amp; latte</text>
              <text x="480" y="388" text-anchor="middle">Card game</text>
              <text x="320" y="363" text-anchor="middle">Front door</text>
            </g>
          </svg>
